# ══════════════════════════════════════════════════════════════════════════════
#  MEMORY ENGINE — THÈMES DE CONSOLIDATION
#  Pour ajouter un thème : une entrée dans ce fichier suffit (sans toucher au code Python). 
#  Redémarrez l'agent / le bot pour prendre en compte les changements.
#
#  keywords : mots-clés qui orientent le LLM lors du classement des faits.
#  Un mot-clé peut se retrouver dans un ou plusieurs thèmes.
#
#  L'ORDRE des thèmes ici détermine l'ordre de restitution lors de la consolidation 
#  (consolidate_long_memory respecte l'ordre déclaré).
#
#  Le thème avec une liste "keywords" vide sert de bac par défaut. A toujours garder ("faits_ponctuels")
# ══════════════════════════════════════════════════════════════════════════════

