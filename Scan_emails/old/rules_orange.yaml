# Règles de pré-classification pour la boîte Orange (personnelle).
# Même moteur que rules_jfbconseils.yaml (Outlook/Gmail), 
# mais fichier séparé — dossiers cibles différents (voir taxonomy_orange.yaml).
#
# match_type: "domain" (partie après @, exacte), "domain_suffix" (domaine ou
#             sous-domaine), ou "sender" (adresse exacte)
# folder: chemin exact de taxonomy_orange.yaml
# action: "classer" (défaut), "low_value" (part quand même dans "À trier" —
#         Orange ne supprime jamais automatiquement, voir scan.orange_classify_only)

rules:
  # Demande explicite : LinkedIn / offres d'emploi / newsletters ...
  # doivent atterrir dans "À trier" pour relecture, jamais classées ailleurs ni supprimées automatiquement.

  - match_type: domain_suffix
    match: "linkedin.com"
    folder: null
    action: low_value 

